# HCPU bring-up for 8086tiny serial porting on 黄山派 (sf32lb52-lchspi-ulp).
# PSRAM (MPI1 OPSRAM) and UART1 come from the board configuration itself
# (board.conf: BSP_ENABLE_MPI1 + BSP_MPI1_MODE_3, BSP_USING_UART1 + DMA RX),
# so only application-level switches belong here.
CONFIG_RT_USING_FINSH=y
CONFIG_FINSH_USING_MSH=y
CONFIG_FINSH_USING_MSH_DEFAULT=y
# Dedicated PSRAM heap for guest RAM and the floppy image.
CONFIG_RT_USING_MEMHEAP=y
